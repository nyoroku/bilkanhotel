{% for item in items %}
<div class="flex flex-wrap -mx-3 mb-2">
  <div class="w-full px-3 is-4">{{ item.name }}</div>
  <div class="w-full px-3 is-2"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">{{ item.stock_quantity }}</span></div>
  <div class="w-full px-3 is-4">
    <button class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 text-xs px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white"
            onclick="addRow('{{ item.id }}', '{{ item.name }}',
                            '{{ item.stock_quantity }}', '{{ section }}')">
      Add to list
    </button>
  </div>
</div>
{% empty %}
<p class="help">No items found.</p>
{% endfor %}
