{% extends 'pos/base.html' %}
{% block title %}Quick Stock – {{ section }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 mb-4 is-4">Quick Stock Count – {{ section }}</h1>

<!-- HTMX search -->
<input type="text"
       hx-get="{% url 'shift_stock_lookup' section %}"
       hx-target="#rows"
       hx-trigger="keyup changed delay:300ms"
       placeholder="Type item name…"
       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 mb-4">

<div id="rows"></div>

<!-- hidden form for saving -->
<form method="post" id="save-form">
  {% csrf_token %}
  <div id="saved-rows"></div>
  <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-green-600 hover:bg-green-700 text-white mt-4">Save All Counts</button>
</form>

<!-- JS to push rows into the form -->
<script>
function addRow(id, name, system, section) {
  const tpl = `
    <div class="flex flex-wrap -mx-3 mb-2">
      <div class="w-full px-3 is-4">${name}</div>
      <div class="w-full px-3 is-2"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium">${system}</span></div>
      <div class="w-full px-3 is-4">
        <input type="number" step="0.001" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 text-xs px-2.5 py-1.5"
               name="phys_${id}" required>
      </div>
      <input type="hidden" name="ids" value="${id}">
    </div>`;
  document.getElementById('saved-rows').insertAdjacentHTML('beforeend', tpl);
}
</script>
{% endblock %}
