{% extends 'pos/base.html' %}

{% block title %}{{ report_title }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-md overflow-hidden">
    <header class="border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <p class="text-lg font-bold text-gray-800 is-centered text-2xl font-semibold">
            {{ report_title }}
        </p>
    </header>

    <div class="p-6">
        <!-- Filter Bar -->
        <form id="variance-filters"
              hx-get="{{ request.path }}" {# Submits to the current URL #}
              hx-target="#variance-report-container"
              hx-swap="innerHTML"
              class="bg-white rounded-lg shadow-md p-6 mb-4 has-background-light p-4">

            <div class="mb-4 is-horizontal">
                <div class="field-label is-normal">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date Range</label>
                </div>
                <div class="field-body">
                    <div class="mb-4">
                        <p class="relative">
                            <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" type="date" name="start_date" value="{{ start_date|date:'Y-m-d' }}">
                        </p>
                    </div>
                    <div class="mb-4">
                        <p class="relative">
                            <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" type="date" name="end_date" value="{{ end_date|date:'Y-m-d' }}">
                        </p>
                    </div>
                     <div class="mb-4">
                        <p class="relative">
                            <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-sky-500 hover:bg-sky-600 text-white">
                                <span class="icon"><i class="fas fa-filter"></i></span>
                                <span>Filter</span>
                            </button>
                        </p>
                    </div>
                </div>
            </div>
        </form>

        <!-- Container for the dynamic report table -->
        <div id="variance-report-container">
            {% include 'pos/partials/_po_variance_report_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
