<div class="modal is-active">
    <div class="modal-background" onclick="this.parentElement.remove(); document.getElementById('modal-container').innerHTML = '';"></div>
    <div class="modal-card" style="max-width: 400px; width: 90%;">
        <header class="modal-card-head">
            <p class="modal-card-title">Sell {{ item.name }}</p>
            <button type="button" class="delete" aria-label="close"
                    onclick="this.closest('.modal').remove(); document.getElementById('modal-container').innerHTML = '';"></button>
        </header>
        <section class="modal-card-body">
            <p class="text-base mb-3">
                Price: <strong>{{ item.selling_price }} KES/kg</strong>
            </p>

            <form hx-post="{% url 'pos:htmx_add_order_item' %}"
                  hx-target="#{{ module|lower }}-cart-summary"
                  hx-swap="outerHTML"
                  hx-on:htmx:after-request="
                    if(event.detail.successful) {
                        this.closest('.modal').remove();
                        document.getElementById('modal-container').innerHTML = '';
                        if(typeof showToast === 'function') {
                            showToast('✅ {{ item.name }} added', 'is-success');
                        }
                    } else {
                        if(typeof showToast === 'function') {
                            showToast('❌ Error adding item', 'is-danger');
                        }
                    }
                  ">
                {% csrf_token %}
                <input type="hidden" name="menu_item_id" value="{{ item.id }}">
                <input type="hidden" name="module" value="{{ module }}">

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount to Pay (KES)</label>
                    <div class="relative">
                        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2"
                               type="number"
                               step="0.01"
                               name="custom_amount"
                               placeholder="e.g., 700"
                               required
                               autofocus
                               min="0.01">
                    </div>
                    <p class="help">Enter total amount. System calculates weight.</p>
                </div>

                <div class="mb-4 mt-4">
                    <div class="relative">
                        <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-green-600 hover:bg-green-700 text-white is-fullwidth">Add to Order</button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</div>
