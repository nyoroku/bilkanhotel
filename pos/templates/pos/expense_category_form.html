{% extends 'pos/base.html' %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 mb-4 is-2">{{ form_title }}</h1>
<div class="flex flex-wrap -mx-3 is-centered"><div class="w-full px-3 md:w-1/2"><div class="bg-white rounded-lg shadow-md p-6 mb-4">
    <form method="post">
        {% csrf_token %}
        <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">{{ form.name.label }}</label><div class="relative">{{ form.name }}</div></div>
        <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">{{ form.description.label }}</label><div class="relative">{{ form.description }}</div></div>
        <hr>
        <div class="mb-4 flex space-x-2"><div class="relative"><button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-green-600 hover:bg-green-700 text-white">Save Category</button></div><div class="relative"><a href="{% url 'pos:expense_category_list' %}" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 is-light">Cancel</a></div></div>
    </form>
</div></div></div>
{% endblock %}
