{% extends 'pos/base.html' %}

{% block title %}Expense Report{% endblock %}

{% block content %}
<div class="container mx-auto px-4 lg:max-w-7xl is-fluid">

    <form class="bg-white rounded-lg shadow-md p-6 mb-4"
          id="expense-filter-form"
          hx-get="{% url 'pos:expense_list' %}"
          hx-trigger="change from:.filter-input, keyup from:#search-input changed delay:300ms"
          hx-target="#report-wrapper"
          hx-swap="innerHTML">

        <div class="flex flex-wrap -mx-3 is-vcentered">
            <div class="w-full px-3 md:w-1/3">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Date Range</label>
                    <div class="mb-4 has-addons">
                        <div class="relative"><input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 filter-input" type="date" name="start_date" value="{{ start_date }}"></div>
                        <div class="relative"><a class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 is-static">to</a></div>
                        <div class="relative"><input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 filter-input" type="date" name="end_date" value="{{ end_date }}"></div>
                    </div>
                </div>
            </div>
            <div class="w-full px-3">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Category</label>
                    <div class="relative">
                        <div class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md border is-fullwidth">
                            <select name="category" class="filter-input">
                                <option value="">All Categories</option>
                                {% for cat in all_categories %}
                                <option value="{{ cat.id }}" {% if category_filter|add:0 == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="w-full px-3">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search Description</label>
                    <div class="relative has-icons-left">
                         <input id="search-input" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" type="search" name="q" placeholder="e.g., KPLC, Rent..." value="{{ search_query }}">
                         <span class="icon is-left"><i class="fas fa-search"></i></span>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div id="report-wrapper"
         hx-get="{% url 'pos:expense_list' %}?start_date={{ start_date }}&end_date={{ end_date }}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="bg-white rounded-lg shadow-md p-6 mb-4 text-center"><p class="has-text-grey-light">Loading report...</p></div>
    </div>
</div>
{% endblock %}
