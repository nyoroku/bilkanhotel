{% extends 'pos/base.html' %}

{% block title %}Sales Report{% endblock %}

{% block content %}
    {% load custom_filters %}
<div class="container mx-auto px-4 lg:max-w-7xl is-fluid">

    <form class="bg-white rounded-lg shadow-md p-6 mb-4"
          hx-get="{% url 'pos:sales_report' %}"
          hx-trigger="change"
          hx-target="#report-wrapper"
          hx-swap="innerHTML">

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Date Range</label>
            <div class="mb-4 has-addons">
                <div class="relative">
                    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 text-lg px-6 py-3" type="date" name="start_date" value="{{ start_date }}" id="start-date-input">
                </div>
                <div class="relative">
                    <a class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 is-static text-lg px-6 py-3">to</a>
                </div>
                <div class="relative">
                    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 text-lg px-6 py-3" type="date" name="end_date" value="{{ end_date }}" id="end-date-input">
                </div>
            </div>
            <p class="help">Report will update automatically when you pick a new date.</p>
        </div>
    </form>

    <div id="report-wrapper">
        {% include 'pos/partials/sales_report_content.html' %}
    </div>

    <div class="buttons is-right mt-5">
        <button class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-blue-600 hover:bg-blue-700 text-white text-lg px-6 py-3" onclick="printReport()">
            <span class="icon">
                <i class="fas fa-print"></i>
            </span>
            <span>Print Report</span>
        </button>
    </div>

</div>

<script>
function printReport() {
    // Get current date values
    const startDate = document.getElementById('start-date-input').value;
    const endDate = document.getElementById('end-date-input').value;

    // Create a new window with the print version
    const printUrl = "{% url 'pos:print_sales_report' %}?start_date=" + startDate + "&end_date=" + endDate;
    const printWindow = window.open(printUrl, '_blank');

    // Wait for the content to load, then trigger print dialog
    printWindow.onload = function() {
        printWindow.print();
        // Optional: Close the window after printing (user can cancel this)
        printWindow.onafterprint = function() {
            printWindow.close();
        };
    };
}
</script>

{% endblock %}
