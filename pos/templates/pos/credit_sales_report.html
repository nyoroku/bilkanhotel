{% extends 'pos/base.html' %}

{% block title %}Credit Sales Report{% endblock %}

{% block content %}
<div class="container mx-auto px-4 lg:max-w-7xl is-fluid">

    <form class="bg-white rounded-lg shadow-md p-6 mb-4"
          hx-get="{% url 'pos:credit_sales_report' %}"
          hx-trigger="change"
          hx-target="#report-wrapper"
          hx-swap="innerHTML">

        <div class="flex flex-wrap -mx-3 is-vcentered">
            <div class="w-full px-3">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Date Range</label>
                    <div class="mb-4 has-addons">
                        <div class="relative">
                            <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 text-lg px-6 py-3" type="date" name="start_date" value="{{ start_date }}">
                        </div>
                        <div class="relative">
                            <a class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 is-static text-lg px-6 py-3">to</a>
                        </div>
                        <div class="relative">
                            <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2 text-lg px-6 py-3" type="date" name="end_date" value="{{ end_date }}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="w-full px-3">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Customer</label>
                    <div class="relative">
                        <div class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md border is-fullwidth text-lg px-6 py-3">
                            <select name="customer" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2">
                                <option value="">All Customers with Credit</option>
                                {% for customer in all_customers %}
                                <option value="{{ customer.id }}" {% if customer_filter|add:0 == customer.id %}selected{% endif %}>
                                    {{ customer.name }} (Owes {{ customer.credit_balance|floatformat:2 }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div id="report-wrapper">
        {% include 'pos/partials/_printable_report_wrapper.html' %}
    </div>

</div>
<script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
{% endblock %}
