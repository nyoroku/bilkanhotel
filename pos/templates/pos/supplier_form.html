{% extends 'pos/base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="flex flex-wrap -mx-3 is-centered">
    <div class="w-full px-3 md:w-2/3">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <header class="border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <p class="text-lg font-bold text-gray-800 is-centered text-2xl font-semibold">
                    {{ form_title }}
                </p>
            </header>
            <div class="p-6">
                <form method="post">
                    {% csrf_token %}

                    {# This will render all form fields neatly using crispy forms #}
                    {{ form|crispy }}

                    <hr>
                    <div class="mb-4 flex space-x-2 is-grouped-centered">
                        <div class="relative">
                            <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-blue-600 hover:bg-blue-700 text-white text-lg px-6 py-3">
                                <span class="icon"><i class="fas fa-save"></i></span>
                                <span>Save</span>
                            </button>
                        </div>
                        <div class="relative">
                            <a href="{% if back_url %}{% url back_url %}{% else %}{% url 'pos:pos' %}{% endif %}" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 is-light text-lg px-6 py-3">
                                Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
