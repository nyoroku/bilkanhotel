{% extends 'pos/base.html' %}
{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-md overflow-hidden">
    <header class="border-b border-gray-200 px-6 py-4 flex items-center justify-between"><p class="text-lg font-bold text-gray-800 is-centered">{{ form_title }}</p></header>
    <div class="p-6">
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Item to Request</label>
                <div class="relative"><div class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md border is-fullwidth">
                    <select name="menu_item" required>
                        <option value="">-- Select an item --</option>
                        {% for item in form_items %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}
                    </select>
                </div></div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Needed</label>
                <div class="relative"><input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" type="number" name="quantity" step="0.01" required></div>
            </div>
            <hr>
            <div class="mb-4"><div class="relative"><button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md font-semibold focus:outline-none transition ease-in-out duration-150 bg-blue-600 hover:bg-blue-700 text-white is-fullwidth">Submit Request</button></div></div>
        </form>
    </div>
</div>
{% endblock %}
